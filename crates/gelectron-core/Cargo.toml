[package]
name = "gelectron-core"
version = "0.1.0"
edition = "2021"
description = "Gelectron native core - Servo-based Electron replacement"
license = "MIT"
authors = ["mileswa1q22"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# Window management
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"

# Native UI
muda = "0.15"
tray-icon = "0.19"
rfd = "0.15"
notify-rust = "4"

# Image handling
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Encryption / secure storage
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }

# Misc
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
open = "5"
sys-locale = "0.3"

[build-dependencies]
napi-build = "2"
