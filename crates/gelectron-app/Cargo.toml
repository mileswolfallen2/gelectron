[package]
name = "gelectron"
version = "0.1.0"
edition = "2021"
description = "Gelectron - Firefox-engine alternative to Electron"
license = "MIT"
authors = ["mileswa1q22"]

[[bin]]
name = "gelectron"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wry = "0.47"
tao = "0.30"
muda = "0.15"
arboard = "3"
rfd = "0.15"
png = "0.18"
base64 = "0.22"
url = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
