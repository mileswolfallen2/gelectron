[workspace]
members = ["crates/gelectron-core"]
resolver = "2"

[workspace.dependencies]
napi = { version = "2", features = ["async", "napi8", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
codegen-units = 1
